name: CI

# Tooling: mise (mise.toml) pins Go and golangci-lint and defines the tasks.
# jdx/mise-action installs both, so actions/setup-go is not used; the Go
# build/module cache is restored explicitly with actions/cache instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable autocrlf before checkout (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned tools (Go, golangci-lint) from mise.toml
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-

      - name: Git identity for tests
        run: |
          git config --global user.name "fxvcs-ci"
          git config --global user.email "ci@fxvcs.invalid"
          git config --global init.defaultBranch main
          git --version
          go version

      - name: go build
        run: go build ./...

      - name: vet
        run: mise run vet

      - name: test
        run: mise run test

      - name: build binary
        run: mise run build

      - name: smoke-test binary
        run: |
          exe=./bin/fxvcs
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            exe=./bin/fxvcs.exe
          fi
          "$exe" version --json

      - name: test -race (Linux/macOS)
        if: runner.os != 'Windows'
        run: mise run test-race

  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-lint-${{ runner.os }}-

      - name: ci (fmt-check, vet, lint, test)
        run: mise run ci

      - name: go mod tidy check
        run: mise run tidy-check

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
