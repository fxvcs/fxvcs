# Combines docs/spec/health-and-rollback.md §1, docs/product-scope.md hook and
# secret-provider examples, and docs/spec/trust-and-signing.md.
apiVersion: fxvcs.dev/v1alpha1
kind: Target
metadata:
  name: dev
spec:
  release: v1.4.0
  environment: dev
  agentID: agent-host-a
  authority: gitops
  runtimeRef: fxserver-dev
  retention:
    keep: 5
  secrets:
    defaultProvider: local-file
    namespaces:
      discord:
        provider: fxvcs-cloud
  health:
    startupGrace: 3m
    interval: 5s
    timeout: 2s
    successThreshold: 3
    failureThreshold: 3
    soakDuration: 2m
    onFailure: keep # rollback | keep | none
    maxAutomaticRollbacks: 1
    rollbackWindow: 30m
    activationWindow: null
    maxPlayersForRestart: null
    checks:
      - type: tcp
      - type: fivem-http
        endpoints: [/info.json, /dynamic.json]
      - type: rcon-status
      - type: fxvcs-resource-state
  hooks:
    postMaterialize:
      - id: render-server-values
        type: template.v1
        template:
          repository: core
          path: deploy/config/server-values.cfg.tmpl
          digest: sha256:ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb
        destination: runtime/config/server-values.cfg
        mode: "0600"
        inputs:
          inventoryApiKey:
            secret:
              namespace: inventory
              key: api-key
          rconPassword:
            secret:
              namespace: fivem
              key: rcon-password
          hostname:
            target: server.hostname
          releaseID:
            release: id
          motd:
            literal: Welcome to the development server
    preActivate:
      - id: validate-cfg
        type: template.v1
        template:
          repository: core
          path: deploy/config/validate.cfg.tmpl
          digest: sha256:3e23e8160039594a33894f6564e1b1348bbd7a0088d42c4acb73eeaed59c009d
        destination: runtime/config/validate.cfg
        mode: "0644"
  verifiers:
    resource-present:
      implementation: fxserver-resource-list
      implementationVersion: 1
      endpointRef: rcon-main
  trust:
    coordination:
      authority: signed-promotion-tag # signed-commit-tip | signed-promotion-tag
      signatures: required # required | optional | off
      allowedSignersFile: trust/allowed_signers
      promotionTagPrefix: refs/tags/fxvcs/promote/dev/
