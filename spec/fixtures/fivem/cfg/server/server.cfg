# Fixture server.cfg: exercises ensure/start/stop, quoting, comments,
# trailing whitespace, exec chains, resource-relative exec, and repeats.
endpoint_add_tcp "0.0.0.0:30120"
sv_hostname "fixture # not a comment inside quotes"
set sv_enforceGameBuild 2802

ensure mapmanager   
start chat            # trailing comment after spaces
ensure "city-map"
ENSURE 'bank'
start anticheat multi-game
ensure bad name!     # second token is invalid and ignored
stop chat            # ignored: never infers disabled

exec resources.cfg
exec @vendor/config.cfg
exec sub/dir/more.cfg
exec resources.cfg   # already parsed: not parsed again
